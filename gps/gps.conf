# loc HAL (LineageOS android_hardware_qcom_gps msm8994 loc_eng.cpp)
# overrides modem XTRA URLs with these when they are non-empty.
# GpsXtraDownloader GETs the same keys over Wi-Fi. Do not comment out.
# GitHub (bullhead gps.conf / CyanogenMod Xtra Fixes): xtra3 HTTPS, not xtra2.
XTRA_SERVER_QUERY=0
XTRA_SERVER_1=https://xtrapath1.izatcloud.net/xtra3grc.bin
XTRA_SERVER_2=https://xtrapath2.izatcloud.net/xtra3grc.bin
XTRA_SERVER_3=https://xtrapath3.izatcloud.net/xtra3grc.bin

# DISABLE=0 AUTO=1 XTRA2=2 XTRA3=3. AUTO + xtra3grc.bin (bullhead).
XTRA_VERSION_CHECK=1

# Error Estimate: _SET=1 _CLEAR=0
ERR_ESTIMATE=0

# Framework GnssLocationProvider (not loc_eng table). One NTP.
NTP_SERVER=pool.ntp.org

# DEBUG: 0 none, 1 Error, 2 Warning, 3 Info, 4 Debug, 5 Verbose
DEBUG_LEVEL=3

INTERMEDIATE_POS=0

# SUPL 2.0 (8992 IZat). Must be in gps.conf, not only overlay.
SUPL_VER=0x20000

# MSB only. MSA (0x2) is a RIL SUPL PDN. loc HAL default SUPL_MODE=0x3.
SUPL_MODE=1

# SCHEDULING=0x01 MSB=0x02 ON_DEMAND_TIME=0x10 GEOFENCE=0x20. No MSA (0x04).
CAPABILITIES=0x33

################################
##### AGPS server settings #####
################################

# Framework + loc_eng_set_server. Wi-Fi is enough; no RIL PDN.
SUPL_HOST=supl.google.com
SUPL_PORT=7275

# loc HAL default is 1 (emergency PDN). Off: no RIL.
USE_EMERGENCY_PDN_FOR_EMERGENCY_SUPL=0
SUPL_ES=0

# 0 RRLP (default). LPP control plane needs LTE/RIL.
LPP_PROFILE=0

NMEA_PROVIDER=0

# 0x1 RRC CPlane  0x2 RRLP UPlane  0x4 LLP Uplane
A_GLONASS_POS_PROTOCOL_SELECT=0
