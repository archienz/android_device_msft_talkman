# Talkman QCA6174 2x2 hostapd default. Installed as hostapd_default.conf.
# No interface BSSID. Persist/OTP supplies the MAC.

interface=wlan0
driver=nl80211
ctrl_interface=/data/vendor/wifi/hostapd/ctrl
ssid=AndroidAP
hw_mode=g
channel=6
ieee80211n=1
ieee80211ac=0
ieee80211w=0
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC-123][DSSS_CCK-40]
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
auth_algs=1
ignore_broadcast_ssid=0
wowlan_triggers=any
