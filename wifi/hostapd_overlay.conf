# Talkman QCA6174 2x2 SoftAP overlay. Leftover bullhead had none;
# LOS 18.1 hostapd must stay WPA2-PSK 11n, no SAE / 6 GHz / VHT AP.
# No BSSID/MAC in this file.

driver=nl80211
ieee80211n=1
ieee80211ac=0
ieee80211w=0
hw_mode=g
channel=6
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC-123][DSSS_CCK-40]
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
sae_require_mfp=0
sae_pwe=0
ignore_broadcast_ssid=0
wowlan_triggers=any
