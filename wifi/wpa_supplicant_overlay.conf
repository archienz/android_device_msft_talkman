# Talkman QCA6174 2x2 802.11ac. Match leftover bullhead overlay, then
# pin LOS 18.1 keys the Rome firmware cannot do (no WPA3/SAE, no 6 GHz).
# MAC is persist/OTP, not this file.

disable_scan_offload=1
p2p_disabled=1
tdls_external_control=1
interworking=1
hs20=1
auto_interworking=0
driver_param=use_p2p_group_interface=1
bss_max_count=512
bss_no_flush_when_down=1

# Rome firmware: no SAE, no PMF-required.
pmf=0
ieee80211w=0
sae_pwe=0
update_config=1
