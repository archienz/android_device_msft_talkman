#
# Talkman sensor inventory. Not Qualcomm SSC SMGR, not nanohub, not FPC.
#
# sensors.qcom / sensors.ssc.so are not used. The AP I2C HAL
# (sensors.talkman) talks to the chips below. This file has no SMGR
# UUID / i2c_bus / SAM algorithm rows so a leftover SSC daemon cannot
# bind MPU6050 / BMI160 / BMM150 / RPR0521 / context-hub fusion.
#
# Hardware (WOA ACPI 8992 + Linux sensors.dtsi):
#   /dev/i2c-4  BLSP1 QUP5  GPIO 23/24
#     ICM-206xx  @ 0x68   accel + gyro   (WHO 0xAB, ICM-20648-class)
#     AK09912    @ 0x0c   magnetometer
#     ZPA2326    @ 0x5c   pressure + die temp
#   /dev/i2c-7  BLSP2 QUP1  GPIO 43/44
#     QPDS-T900  @ 0x39   prox + ALS     (APS1 MSHW1016, APDS-9930)
#   GPIO 42 / 75          hall front/back (HALL MSHW1015)
#
# sap.conf NDK names (SENSOR_PROVIDER=2) — must match sensors.talkman:
#   ACCEL_NAME=ICM-206xx Accelerometer
#   GYRO_NAME=ICM-206xx Gyroscope
#   MAG_NAME=AK09912 Magnetometer
#   PRESSURE_NAME=ZPA2326 Pressure
#   TEMPERATURE_NAME=ZPA2326 Temperature
#
# Not present: nanohub, FPC fingerprint, BMI160, SIAD MSHW100F @ 0x2c.
#

:version 0x00000001
:hardware 8992
:platform
:property
