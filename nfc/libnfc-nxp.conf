###############################################################################
# Application options 
# Logging Levels
# NXPLOG_DEFAULT_LOGLEVEL    0x01  
# ANDROID_LOG_DEBUG          0x03 
# ANDROID_LOG_WARN           0x02 
# ANDROID_LOG_ERROR          0x01 
# ANDROID_LOG_SILENT         0x00
#
NXPLOG_EXTNS_LOGLEVEL=0x03
NXPLOG_NCIHAL_LOGLEVEL=0x03
NXPLOG_NCIX_LOGLEVEL=0x03
NXPLOG_NCIR_LOGLEVEL=0x03
NXPLOG_FWDNLD_LOGLEVEL=0x03
NXPLOG_TML_LOGLEVEL=0x03

###############################################################################
# Extension for Mifare reader enable
MIFARE_READER_ENABLE=0x01
LEGACY_MIFARE_READER=1

###############################################################################
# Verizon-only NCI extras. Talkman is not a VZW SKU.
VZW_FEATURE_ENABLE=0x00
###############################################################################

# nfc_nci.msm8992.so dlopen path is /system/vendor/firmware/ + NXP_FW_NAME
# (default libpn547_fw.so). Filename only — not the ACPI EEPROM bin.
NXP_FW_NAME=libpn547_fw.so
NXP_NFC_DEV_NODE="/dev/pn547"

###############################################################################
# Chip is NXP PN547C2 (WOA ACPI PNP0547 / PN547). Not PN548 / PN553.
#PN547C2            0x01
#PN65T              0x02
#PN548AD            0x03
#PN66T              0x04
NXP_NFC_CHIP=0x01

###############################################################################
# No eSE on talkman (kernel nq-nci). HCE is host-routed.
# No secure element 0x00
# eSE               0x01
# UICC              0x02
NXP_DEFAULT_SE=0x00

###############################################################################
# Firmware file type
#.so file   0x01
#.bin file  0x02
NXP_FW_TYPE=0x01

###############################################################################
# System clock source selection configuration
#define CLK_SRC_XTAL       1
#define CLK_SRC_PLL        2

NXP_SYS_CLK_SRC_SEL=0x02

###############################################################################
