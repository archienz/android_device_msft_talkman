# Talkman QCA6174 (Rome UART). CAF libbt-vendor vnd keys.
# UART is BLSP ttyHS0 (init.talkman.rc). Firmware is vendor rampatch/nvm
# via /bt_firmware/image -> /vendor/firmware (BOARD_ROOT_EXTRA_SYMLINKS).
# BD_ADDR is not in this file. libbt-vendor:
#   1. /persist/bdaddr.txt (ro.bt.bdaddr_path)
#   2. QCA OTP when persist is missing (USE_CONTROLLER_BDADDR + NVM tag 2 zeros)
# Do not put a sample MAC here.

BLUETOOTH_UART_DEVICE_PORT = "/dev/ttyHS0"
FW_PATCHFILE_LOCATION = "/vendor/firmware/"
UART_TARGET_BAUD_RATE = 3000000
FW_PATCH_SETTLEMENT_DELAY_MS = 100
BT_WAKE_VIA_USERIAL_IOCTL = TRUE
LPM_IDLE_TIMEOUT_MULTIPLE = 5
USE_CONTROLLER_BDADDR = TRUE
BTVND_DBG = FALSE
BTHW_DBG = FALSE
VNDUSERIAL_DBG = FALSE
UPIO_DBG = FALSE
